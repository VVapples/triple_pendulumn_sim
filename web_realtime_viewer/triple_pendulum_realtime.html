<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triple pendulum realtime viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10131b;color:#e8eaf0;font:14px system-ui,sans-serif}
#view{width:100%;height:100%;display:block}#panel{position:fixed;top:12px;left:12px;z-index:2;width:300px;padding:14px;border-radius:8px;background:#121620ed;box-shadow:0 3px 18px #0008}
label{display:block;margin:7px 0}input{width:78px;margin-left:5px}button{margin:3px;padding:5px 8px}#status{margin-top:8px;color:#cbd2e2;line-height:1.4}.hint{color:#9da6ba;font-size:12px;margin-top:8px}details{margin-top:8px;padding:6px 8px;border-radius:6px;background:#0b0e1599}summary{cursor:pointer;font-weight:600;color:#e8eaf0}#gifStatus{font-size:12px;color:#69db7c;margin-top:4px}
</style>
</head>
<body>
<div id="panel"><b>Triple pendulum realtime</b> <span>v1.6-web-2D</span><label>Paste voxel <input id="pasteBox" type="text" placeholder="theta1, theta2, theta3" style="width:155px"><button id="applyPaste">Apply</button></label>
<label>theta1 <input id="a1" type="number" step="any" value="1.2"> theta2 <input id="a2" type="number" step="any" value="1.8"></label>
<label>theta3 <input id="a3" type="number" step="any" value="2.4"></label>
<label>dt <input id="dt" type="number" step=".001" min=".0001" value=".005"></label>
<label>fade start <input id="fadeStart" type="number" min="0" step=".1" value="10"> fade time <input id="fadeTime" type="number" min=".01" step=".1" value="10"></label>
<button id="pause">Pause</button><button id="slower">Slower</button><button id="faster">Faster</button><button id="reset">Reset</button><button id="clear">Clear trace</button>
<details><summary>Export GIF</summary>
<label>start time (s) <input id="gifStart" type="number" min="0" step=".1" value="0"> end time (s) <input id="gifEnd" type="number" min=".1" step=".1" value="10"></label>
<label>gif length (s) <input id="gifLength" type="number" min=".1" step=".1" value="5"> framerate <input id="gifFps" type="number" min="1" max="100" step="1" value="30"></label>
<button id="exportGif">Generate GIF</button><div id="gifStatus"></div>
</details>
<div id="status">Starting...</div><div class="hint">Space: pause/resume. Left/right arrows: speed.<br>Drag to pan, wheel to zoom. 2D physical plane: x-y.</div></div>
<canvas id="view"></canvas>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","gifenc":"https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm"}}
</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"; import {GIFEncoder, quantize, applyPalette} from "gifenc";
const canvas=document.getElementById("view"),status=document.getElementById("status");
window.addEventListener("error",event=>{status.textContent="Viewer error: "+event.message});
window.addEventListener("unhandledrejection",event=>{status.textContent="Viewer error: "+event.reason});
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x10131b);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-3.6,3.6,3.6,-3.6,.1,100),controls=new OrbitControls(camera,canvas);
controls.enableRotate=false;controls.enableDamping=true;controls.screenSpacePanning=true;
camera.position.set(0,0,10);camera.up.set(0,1,0);camera.lookAt(0,0,0);controls.target.set(0,0,0);controls.update();
const grid=new THREE.GridHelper(8,16,0x354052,0x202734);grid.rotation.x=Math.PI/2;scene.add(grid);scene.add(new THREE.AmbientLight(0xffffff,2));
const root=new THREE.Group();scene.add(root);const rod=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x58a6ff,linewidth:3,depthTest:false}));rod.renderOrder=10;root.add(rod);
const bob=new THREE.InstancedMesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshBasicMaterial({color:0xff4d5a,depthTest:false}),3);bob.renderOrder=11;root.add(bob);
const traceGroup=new THREE.Group();traceGroup.renderOrder=9;root.add(traceGroup);
const traceLines=Array.from({length:16},(_,i)=>{const line=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x2f9cff,transparent:true,opacity:(i+1)/16,depthTest:false,depthWrite:false}));line.renderOrder=9+i;traceGroup.add(line);return line});
const axes=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x778899}));
axes.geometry.setAttribute("position",new THREE.Float32BufferAttribute([-4,0,0,4,0,0,0,-4,0,0,4,0],3));root.add(axes);
const params={g:9.8,l:[1,1,1],m:[1,1,1]}, state={q:[1.2,1.8,2.4],p:[0,0,0],t:0,run:true,speed:1,traceT:[],traceP:[],energy0:0,energy:[]};
const val=id=>Number(document.getElementById(id).value);
function mass(q){const a=[3,2,1],M=Array.from({length:3},()=>Array(3).fill(0));for(let i=0;i<3;i++)for(let j=0;j<3;j++)M[i][j]=a[Math.max(i,j)]*Math.cos(q[i]-q[j]);return M}
function solve(A,b){const x=A.map((r,i)=>r.slice().concat(b[i]));for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(x[j][i])>Math.abs(x[p][i]))p=j;if(!Number.isFinite(x[p][i])||Math.abs(x[p][i])<1e-12)throw Error("singular mass matrix");[x[i],x[p]]=[x[p],x[i]];for(let j=i+1;j<3;j++){const f=x[j][i]/x[i][i];for(let k=i;k<4;k++)x[j][k]-=f*x[i][k]}}const out=[0,0,0];for(let i=2;i>=0;i--){let s=x[i][3];for(let j=i+1;j<3;j++)s-=x[i][j]*out[j];out[i]=s/x[i][i]}return out}
function ham(q,p){const w=solve(mass(q),p);return .5*p.reduce((v,x,i)=>v+x*w[i],0)+9.8*(3*(1-Math.cos(q[0]))+2*(1-Math.cos(q[1]))+1*(1-Math.cos(q[2])))}
function deriv(s){const w=solve(mass(s.q),s.p),g=[];for(let i=0;i<3;i++){const plus=s.q.slice(),minus=s.q.slice(),e=1e-6;plus[i]+=e;minus[i]-=e;g.push((ham(plus,s.p)-ham(minus,s.p))/(2*e))}return {q:w,p:g.map(x=>-x)}}
function add(a,b,f){return {q:a.q.map((x,i)=>x+f*b.q[i]),p:a.p.map((x,i)=>x+f*b.p[i])}}
function step(s,h){const k1=deriv(s),k2=deriv(add(s,k1,h/2)),k3=deriv(add(s,k2,h/2)),k4=deriv(add(s,k3,h));return {q:s.q.map((x,i)=>x+h*(k1.q[i]+2*k2.q[i]+2*k3.q[i]+k4.q[i])/6),p:s.p.map((x,i)=>x+h*(k1.p[i]+2*k2.p[i]+2*k3.p[i]+k4.p[i])/6)}}
function positions(q){let x=0,y=0,out=[[0,0]];for(const a of q){x+=Math.sin(a);y-=Math.cos(a);out.push([x,y])}return out}
function energy(s){return ham(s.q,s.p)}
function reset(){state.q=[val("a1"),val("a2"),val("a3")];state.p=[0,0,0];state.t=0;state.run=true;state.traceT=[0];state.traceP=[positions(state.q)[3]];state.energy0=energy(state);state.energy=[]}
function draw(){const ps=positions(state.q),arr=[];for(const p of ps)arr.push(p[0],p[1],0);rod.geometry.setAttribute("position",new THREE.Float32BufferAttribute(arr,3));rod.geometry.computeBoundingSphere();for(let i=0;i<3;i++)bob.setMatrixAt(i,new THREE.Matrix4().setPosition(ps[i+1][0],ps[i+1][1],0));bob.instanceMatrix.needsUpdate=true;const fadeStart=val("fadeStart"),fadeTime=Math.max(.001,val("fadeTime")),keep=state.traceT.map(t=>state.t-t<=fadeStart+fadeTime),first=keep.findIndex(Boolean);if(first>0){state.traceP=state.traceP.slice(first);state.traceT=state.traceT.slice(first)}const buckets=Array.from({length:16},()=>[]);for(let i=0;i<state.traceP.length-1;i++){const age=state.t-state.traceT[i],alpha=Math.max(0,Math.min(1,age<=fadeStart?1:1-(age-fadeStart)/fadeTime)),bucket=Math.min(15,Math.floor(alpha*16)),a=state.traceP[i],b=state.traceP[i+1];buckets[bucket].push(a[0],a[1],0,b[0],b[1],0)}for(let i=0;i<16;i++){const geometry=traceLines[i].geometry;geometry.setAttribute("position",new THREE.Float32BufferAttribute(buckets[i],3));geometry.computeBoundingSphere();traceLines[i].material.opacity=(i+.5)/16}const end=ps[3];const err=energy(state)-state.energy0;status.textContent=`t=${state.t.toFixed(2)}s | speed=${state.speed}x | end=(${end[0].toFixed(2)}, ${end[1].toFixed(2)}) | energy error=${Number.isFinite(err)?err.toExponential(3):"NaN"} | trace=${state.traceP.length}`}
function animate(){requestAnimationFrame(animate);try{if(state.run){const n=Math.max(1,Math.round(4*state.speed));for(let i=0;i<n;i++){const h=val("dt"),next=step(state,h);if(!next.q.every(Number.isFinite)||!next.p.every(Number.isFinite))throw Error("non-finite pendulum state");state.q=next.q;state.p=next.p;state.t+=h;state.traceT.push(state.t);state.traceP.push(positions(state.q)[3])}}draw();controls.update();renderer.render(scene,camera)}catch(error){state.run=false;status.textContent="Viewer error: "+error.message;console.error(error)}}function resize(){const aspect=innerWidth/innerHeight, size=3.6;if(aspect>=1){camera.left=-size*aspect;camera.right=size*aspect;camera.top=size;camera.bottom=-size}else{camera.left=-size;camera.right=size;camera.top=size/aspect;camera.bottom=-size/aspect}renderer.setSize(innerWidth,innerHeight,false);camera.updateProjectionMatrix()}addEventListener("resize",resize);resize();
function applyPasteText(raw){const nums=(raw.match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi)||[]).map(Number);if(nums.length<3)return false;["a1","a2","a3"].forEach((id,i)=>{document.getElementById(id).value=nums[i]});reset();draw();return true}
const pasteBox=document.getElementById("pasteBox");
pasteBox.addEventListener("paste",e=>{setTimeout(()=>applyPasteText(pasteBox.value),0)});
pasteBox.addEventListener("keydown",e=>{if(e.key==="Enter")applyPasteText(pasteBox.value)});
document.getElementById("applyPaste").onclick=()=>applyPasteText(pasteBox.value);
async function exportGif(){
  const btn=document.getElementById("exportGif"), gstat=document.getElementById("gifStatus");
  const tStart=Math.max(0,val("gifStart")), tEnd=val("gifEnd"), gifLen=val("gifLength"), fps=Math.max(1,Math.min(100,Math.round(val("gifFps"))));
  if(!(tEnd>tStart)||!(gifLen>0)){gstat.textContent="Error: end time > start time & length > 0 required.";return}
  const q0=[val("a1"),val("a2"),val("a3")], hBase=Math.max(1e-5,val("dt")), fadeStart=val("fadeStart"), fadeTime=Math.max(.001,val("fadeTime"));
  const totalFrames=Math.max(1,Math.round(gifLen*fps)), delayMs=Math.max(10,Math.round(1000/fps));
  const saved={q:state.q.slice(),p:state.p.slice(),t:state.t,run:state.run,speed:state.speed,traceT:state.traceT.slice(),traceP:state.traceP.slice(),energy0:state.energy0,camPos:camera.position.clone(),camTarget:controls.target.clone(),camZoom:camera.zoom,pr:renderer.getPixelRatio()};
  state.run=false; btn.disabled=true;
  try{
    const S=Math.min(720,Math.max(400,Math.round(Math.min(canvas.clientWidth,canvas.clientHeight)/2)*2)), W=S, H=S;
    renderer.setPixelRatio(1); renderer.setSize(W,H,false);
    const sz=4.05;
    camera.left=-sz;camera.right=sz;camera.top=sz;camera.bottom=-sz;camera.zoom=1;
    camera.position.set(0,0,10);controls.target.set(0,0,0);
    camera.updateProjectionMatrix(); controls.update();
    const cap=document.createElement("canvas"); cap.width=W; cap.height=H; const ctx=cap.getContext("2d",{willReadFrequently:true});
    const gif=GIFEncoder(); let palette=null;
    state.q=q0.slice(); state.p=[0,0,0]; state.t=0; state.traceT=[0]; state.traceP=[positions(state.q)[3]]; state.energy0=energy(state);
    const advanceTo=target=>{
      while(state.t<target-1e-12){
        const dt=Math.min(hBase,target-state.t), next=step(state,dt);
        if(!next.q.every(Number.isFinite)||!next.p.every(Number.isFinite))throw Error("non-finite state at t="+state.t.toFixed(3));
        state.q=next.q; state.p=next.p; state.t+=dt; state.traceT.push(state.t); state.traceP.push(positions(state.q)[3]);
        if(state.traceT.length>40000&&state.t-state.traceT[0]>fadeStart+fadeTime+1){
          const cut=state.traceT.findIndex(t=>state.t-t<=fadeStart+fadeTime);
          if(cut>0){state.traceT=state.traceT.slice(cut);state.traceP=state.traceP.slice(cut)}
        }
      }
    };
    if(tStart>0){gstat.textContent=`Fast-forwarding to t=${tStart.toFixed(2)}s...`;await new Promise(r=>setTimeout(r,15));advanceTo(tStart)}
    for(let f=0;f<totalFrames;f++){
      const target=totalFrames===1?tStart:tStart+(tEnd-tStart)*(f/(totalFrames-1));
      advanceTo(target); draw(); renderer.render(scene,camera);
      ctx.drawImage(canvas,0,0,W,H);
      const rgba=ctx.getImageData(0,0,W,H).data;
      if(!palette)palette=quantize(rgba,256);
      const index=applyPalette(rgba,palette);
      gif.writeFrame(index,W,H,{palette:f===0?palette:undefined,delay:delayMs});
      if(f%5===0||f===totalFrames-1){gstat.textContent=`Rendering GIF: ${f+1}/${totalFrames} frames (t=${state.t.toFixed(2)}s)...`;await new Promise(r=>setTimeout(r,0))}
    }
    gif.finish();
    const blob=new Blob([gif.bytes()],{type:"image/gif"}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`triple_pendulum_${q0.map(x=>x.toFixed(3)).join("_")}_t${tStart}-${tEnd}.gif`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    gstat.textContent=`Saved GIF (${totalFrames} frames, ${(blob.size/1e6).toFixed(2)} MB)`;
  }catch(err){gstat.textContent="GIF error: "+err.message;console.error(err)}
  finally{
    const {camPos,camTarget,camZoom,pr,...rest}=saved;
    Object.assign(state,rest);
    renderer.setPixelRatio(pr); camera.position.copy(camPos); controls.target.copy(camTarget); camera.zoom=camZoom;
    btn.disabled=false; resize(); controls.update(); draw(); renderer.render(scene,camera);
  }
}
document.getElementById("exportGif").onclick=exportGif;
document.getElementById("pause").onclick=()=>{state.run=!state.run;document.getElementById("pause").textContent=state.run?"Pause":"Resume"};document.getElementById("faster").onclick=()=>state.speed=Math.min(64,state.speed*2);document.getElementById("slower").onclick=()=>state.speed=Math.max(.125,state.speed/2);document.getElementById("reset").onclick=reset;document.getElementById("clear").onclick=()=>{state.traceT=[state.t];state.traceP=[positions(state.q)[3]]};addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.code==="Space"){state.run=!state.run}if(e.key==="ArrowRight")state.speed=Math.min(64,state.speed*2);if(e.key==="ArrowLeft")state.speed=Math.max(.125,state.speed/2)});
reset();draw();renderer.render(scene,camera);animate();
</script></body></html>
