<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple pendulum chaos voxels</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #10131b; color: #e8eaf0; font: 14px system-ui, sans-serif; }
#view { width: 100%; height: 100%; display: block; }
#panel { position: fixed; top: 12px; left: 12px; z-index: 2; width: 280px; padding: 14px; border-radius: 8px; background: rgba(18, 22, 32, .92); box-shadow: 0 3px 18px #0008; }
label { display: block; margin-top: 9px; } input[type=file] { width: 100%; } input[type=range] { width: 185px; vertical-align: middle; }
button { margin-top: 9px; padding: 5px 9px; } #info { margin-top: 10px; line-height: 1.4; color: #bfc6d7; }
.hint { color: #9da6ba; font-size: 12px; margin-top: 8px; } b { color: #fff; }
#cameraReadout { position: fixed; bottom: 10px; left: 12px; z-index: 2; padding: 8px 10px; border-radius: 6px; background: rgba(18, 22, 32, .92); color: #d7dceb; font: 12px ui-monospace, monospace; }
#voxelReadout { position: fixed; right: 12px; bottom: 10px; z-index: 2; min-width: 250px; padding: 10px; border-radius: 6px; background: rgba(18, 22, 32, .94); color: #d7dceb; font: 12px ui-monospace, monospace; line-height: 1.45; }
</style>
</head>
<body>
<div id="panel">
  <b>Triple-pendulum chaos voxels</b> <span>v2.7</span>
  <label>Open CSV <input id="file" type="file" accept=".csv,text/csv"></label>
  <label>Hide chaos at: <input id="threshold" type="range" min="0" max="1" step=".01" value=".75"> <span id="thresholdValue">0.75</span></label>
  <label>Opacity scale: <input id="opacity" type="range" min=".1" max="2" step=".05" value="1"> <span id="opacityValue">1.00</span></label>
  <button id="reset">Reset view</button>
  <div id="info">Loading embedded data...</div>
  <div class="hint">Drag to rotate, wheel to zoom, right-drag to pan.<br>Axes are initial angles in radians.</div>
</div>
<div id="cameraReadout">Camera: loading...</div>
<div id="voxelReadout">Point at a visible voxel</div>
<canvas id="view"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const embedded = /* EMBEDDED_CSV_ROWS */{"axes":[[],[],[]],"voxels":[]};
const canvas = document.getElementById("view");
const info = document.getElementById("info");
window.addEventListener("error", event => {
  info.textContent = "Viewer error: " + event.message;
});
window.addEventListener("unhandledrejection", event => {
  info.textContent = "Viewer error: " + event.reason;
});
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x10131b);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const root = new THREE.Group();
scene.add(root);
scene.add(new THREE.AmbientLight(0xffffff, 2.4));
let groups = [], records = [], bounds = null, currentThreshold = .75, opacityScale = 1;
const cameraReadout = document.getElementById("cameraReadout");
const voxelReadout = document.getElementById("voxelReadout");
const radiansToDegrees = 180 / Math.PI;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function plasma(t) {
  const stops = [[13,8,135],[126,3,168],[203,71,119],[248,149,64],[240,249,33]];
  const p = Math.max(0, Math.min(1, t)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p)), f = p - i;
  return new THREE.Color((stops[i][0]*(1-f)+stops[i+1][0]*f)/255, (stops[i][1]*(1-f)+stops[i+1][1]*f)/255, (stops[i][2]*(1-f)+stops[i+1][2]*f)/255);
}
function edges(values) {
  const v = [...new Set(values)].sort((a,b)=>a-b);
  if (v.length < 2) throw Error("At least two coordinates are required.");
  const d = v[1] - v[0];
  for (let i=2; i<v.length; i++) if (Math.abs(v[i]-v[i-1]-d) > 1e-7) throw Error("CSV coordinates are not a regular grid.");
  return {values:v, edges:[v[0]-d/2, ...v.slice(0,-1).map((x)=>x+d/2), v.at(-1)+d/2]};
}
function parseCsv(text) {
  const lines = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
  const head = lines.shift().split(",").map(x=>x.trim());
  const idx = Object.fromEntries(head.map((x,i)=>[x,i]));
  for (const key of ["theta1_initial_rad","theta2_initial_rad","theta3_initial_rad","chaos_value","is_interior"])
    if (!(key in idx)) throw Error("CSV is missing required column: " + key);
  const all = lines.map(line => line.split(",")).map(a => ({
    i: Number(a[idx.i ?? 0]), j: Number(a[idx.j ?? 1]), k: Number(a[idx.k ?? 2]),
    x: Number(a[idx.theta1_initial_rad]), y: Number(a[idx.theta2_initial_rad]), z: Number(a[idx.theta3_initial_rad]), chaos: Number(a[idx.chaos_value])
    , interior: Number(a[idx.is_interior]) === 1
  }));
  return {axes: [0,1,2].map(axis => [...new Set(all.map(r => [r.x,r.y,r.z][axis]))].sort((a,b)=>a-b)),
    voxels: all.filter(r => r.interior && Number.isFinite(r.chaos))};
}
function clearRoot() { for (const g of groups) { root.remove(g); g.geometry?.dispose(); g.material?.dispose(); } groups = []; }
function draw(data) {
  if (!data.voxels.length) throw Error("CSV contains no interior voxels.");
  clearRoot(); records = data.voxels;
  const ex=edges(data.axes[0]), ey=edges(data.axes[1]), ez=edges(data.axes[2]);
  bounds={ex,ey,ez};
  let min=Infinity, max=-Infinity;
  for (const record of records) {
    if (record.chaos < min) min = record.chaos;
    if (record.chaos > max) max = record.chaos;
  }
  for (const r of records) r.n = max > min ? (r.chaos-min)/(max-min) : 0;
  updateMeshes(); fitCamera();
  document.getElementById("info").innerHTML = `Grid: ${ex.values.length} &times; ${ey.values.length} &times; ${ez.values.length}<br>Valid voxels: ${records.length}<br>Chaos range: ${min.toPrecision(5)} - ${max.toPrecision(5)}`;
}
function updateMeshes() {
  clearRoot(); const buckets = Array.from({length:16},()=>[]);
  let ix=Infinity, iy=Infinity, iz=Infinity;
  for (const record of records) {
    if (record.i < ix) ix = record.i;
    if (record.j < iy) iy = record.j;
    if (record.k < iz) iz = record.k;
  }
  for (const r of records) if (r.n < currentThreshold) buckets[Math.min(15, Math.floor((r.n/.999999)*16))].push(r);
  const geometry = new THREE.BoxGeometry(1,1,1);
  for (let b=0;b<buckets.length;b++) {
    const list=buckets[b]; if (!list.length) continue;
    const material = new THREE.MeshBasicMaterial({color:plasma((b+.5)/16), transparent:true, opacity:Math.max(.03, (.08+.92*(1-b/15))*opacityScale), depthWrite:false, depthTest:false, blending:THREE.NormalBlending, side:THREE.DoubleSide});
    const mesh = new THREE.InstancedMesh(geometry, material, list.length), matrix=new THREE.Matrix4();
    for (let n=0;n<list.length;n++) { const r=list[n], i=r.i-ix, j=r.j-iy, k=r.k-iz, x=bounds.ex.edges[i], x1=bounds.ex.edges[i+1], y=bounds.ey.edges[j], y1=bounds.ey.edges[j+1], z=bounds.ez.edges[k], z1=bounds.ez.edges[k+1]; matrix.makeScale(x1-x,y1-y,z1-z); matrix.setPosition((x+x1)/2,(y+y1)/2,(z+z1)/2); mesh.setMatrixAt(n,matrix); }
    mesh.instanceMatrix.needsUpdate=true;
    mesh.userData.voxelRecords = list;
    mesh.renderOrder = b;
    root.add(mesh); groups.push(mesh);
  }
  document.getElementById("info").innerHTML += `<br>Visible: ${buckets.reduce((a,b)=>a+b.length,0)} / ${records.length}`;
}
function fitCamera() { const center=new THREE.Vector3(0,0,0), size=Math.max(bounds.ex.edges.at(-1)-bounds.ex.edges[0],bounds.ey.edges.at(-1)-bounds.ey.edges[0],bounds.ez.edges.at(-1)-bounds.ez.edges[0]); camera.position.set(size*1.7,size*1.5,size*1.7); camera.lookAt(center); controls.target.copy(center); controls.update(); }
function updateCameraReadout() {
  const offset = camera.position.clone().sub(controls.target);
  const distance = offset.length();
  const azimuth = Math.atan2(offset.z, offset.x) * radiansToDegrees;
  const elevation = Math.atan2(
    offset.y,
    Math.hypot(offset.x, offset.z),
  ) * radiansToDegrees;
  cameraReadout.textContent =
    `Camera: azimuth ${azimuth.toFixed(1)} deg | ` +
    `elevation ${elevation.toFixed(1)} deg | distance ${distance.toFixed(3)}`;
}
function clearVoxelReadout() {
  voxelReadout.textContent = "Point at a visible voxel";
}
function updateVoxelReadout(event) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const intersections = raycaster.intersectObjects(groups, false);
  if (!intersections.length) {
    clearVoxelReadout();
    return;
  }
  const hit = intersections[0];
  const record = hit.object.userData.voxelRecords[hit.instanceId];
  if (!record) {
    clearVoxelReadout();
    return;
  }
  voxelReadout.innerHTML =
    `<b>Visible voxel</b><br>` +
    `initial theta1: ${record.x.toFixed(6)} rad<br>` +
    `initial theta2: ${record.y.toFixed(6)} rad<br>` +
    `initial theta3: ${record.z.toFixed(6)} rad<br>` +
    `chaos value: ${record.chaos.toFixed(6)}<br>` +
    `normalized chaos: ${record.n.toFixed(4)}<br>` +
    `grid index: (${record.i}, ${record.j}, ${record.k})`;
}
controls.addEventListener("change", updateCameraReadout);
canvas.addEventListener("pointermove", updateVoxelReadout);
canvas.addEventListener("pointerleave", clearVoxelReadout);
document.getElementById("threshold").oninput=e=>{currentThreshold=Number(e.target.value); document.getElementById("thresholdValue").textContent=currentThreshold.toFixed(2); if(records.length) updateMeshes();};
document.getElementById("opacity").oninput=e=>{opacityScale=Number(e.target.value); document.getElementById("opacityValue").textContent=opacityScale.toFixed(2); if(records.length) updateMeshes();};
document.getElementById("reset").onclick=()=>fitCamera();
document.getElementById("file").onchange=async e=>{const f=e.target.files[0]; if(!f)return; try {draw(parseCsv(await f.text()));} catch(err){document.getElementById("info").textContent=err.message;}};
try { draw(embedded); } catch(err) { info.textContent="Viewer error: " + err.message; console.error(err); }
function resize(){const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();} addEventListener("resize",resize); resize();
function animate(){requestAnimationFrame(animate); controls.update(); updateCameraReadout(); renderer.render(scene,camera);} animate();
</script>
</body>
</html>
